<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g transform="translate(50,50)">
    <clipPath id="leftHalf">
      <rect x="-30" y="-30" width="30" height="60"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="0" y="-30" width="30" height="60"/>
    </clipPath>

    <rect x="-30" y="-18" width="60" height="36" rx="18" ry="18"
          fill="none" stroke="#000000" stroke-width="2.5"/>

    <rect x="-30" y="-18" width="60" height="36" rx="18" ry="18"
          fill="#ffffff" clip-path="url(#leftHalf)"/>
    <rect x="-30" y="-18" width="60" height="36" rx="18" ry="18"
          fill="#8b5fbf" clip-path="url(#rightHalf)"/>

    <rect x="-30" y="-18" width="60" height="36" rx="18" ry="18"
          fill="none" stroke="#000000" stroke-width="2.5"/>
  </g>
</svg>
