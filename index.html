<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PILLZ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #c9a8e0;
      --bg: #f7f0e6;
      --text: #4a3b45;
      --white: #ffffff;
      --danger: #b85c5c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 4.5rem 1.5rem 3rem;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
      text-align: center;
    }

    h1 {
      margin: 0 0 2.5rem;
      font-family: "Anton", sans-serif;
      font-size: clamp(3.5rem, 18vw, 6rem);
      letter-spacing: 0.03em;
      line-height: 0.9;
      font-weight: 400;
    }

    .pills-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .pill-btn {
      width: min(190px, 75vw);
      height: 68px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      color: var(--text);
      font-family: "Inter", sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 12px rgba(74, 59, 69, 0.08);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .pill-btn:active {
      transform: scale(0.96);
      box-shadow: 0 2px 6px rgba(74, 59, 69, 0.08);
    }

    .pill-30 {
      background: linear-gradient(
        90deg,
        #ffffff 0%,
        #ffffff 50%,
        #8f6bb3 50%,
        #8f6bb3 100%
      );
    }

    .pill-20 {
      background: #b28fd1;
    }

    .pill-10 {
      background: #d5b8ea;
    }

    .today-section {
      width: min(420px, 100%);
      margin: 3rem auto 0;
    }

    .section-title {
      margin-bottom: 0.9rem;
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0.65;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .entries {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 0.7rem 0.9rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.6);
      font-size: 0.95rem;
    }

    .entry-info {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      text-align: left;
    }

    .entry-time {
      font-variant-numeric: tabular-nums;
      opacity: 0.65;
    }

    .entry-dose {
      font-weight: 600;
    }

    .delete-btn {
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.4;
    }

    .delete-btn:active {
      background: rgba(74, 59, 69, 0.08);
      opacity: 1;
    }

    .empty {
      padding: 0.8rem;
      font-size: 0.9rem;
      opacity: 0.45;
    }

    /* Historique */

    .history {
      width: min(420px, 100%);
      margin: 1.5rem auto 0;
    }

    .history summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.95rem 1rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      list-style: none;
      font-weight: 600;
      user-select: none;
    }

    .history summary::-webkit-details-marker {
      display: none;
    }

    .history summary::after {
      content: "⌄";
      font-size: 1.1rem;
      transition: transform 0.15s ease;
    }

    .history[open] summary::after {
      transform: rotate(180deg);
    }

    .history-content {
      padding-top: 1rem;
    }

    .history-day {
      margin-bottom: 1.4rem;
    }

    .history-day:last-child {
      margin-bottom: 0;
    }

    .history-date {
      margin: 0 0 0.55rem;
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0.6;
      text-align: left;
    }

    .history-empty {
      padding: 1rem 0;
      font-size: 0.9rem;
      opacity: 0.45;
    }

    /* Modal */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(50, 40, 48, 0.35);
    }

    .modal-backdrop.visible {
      display: flex;
    }

    .modal {
      width: min(360px, 100%);
      padding: 1.5rem;
      border-radius: 22px;
      background: var(--bg);
      box-shadow: 0 15px 50px rgba(50, 40, 48, 0.2);
    }

    .modal h2 {
      margin: 0 0 1.2rem;
      font-size: 1.15rem;
    }

    .time-input {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid rgba(74, 59, 69, 0.15);
      border-radius: 12px;
      background: white;
      color: var(--text);
      font: inherit;
      font-size: 1.1rem;
      text-align: center;
    }

    .modal-actions {
      display: flex;
      gap: 0.7rem;
      margin-top: 1rem;
    }

    .modal-btn {
      flex: 1;
      padding: 0.8rem;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-cancel {
      background: rgba(74, 59, 69, 0.08);
      color: var(--text);
    }

    .modal-confirm {
      background: var(--accent);
      color: var(--text);
    }

    /* Confirmation */

    .confirm-text {
      margin: 0 0 1.2rem;
      line-height: 1.5;
    }

    .confirm-delete {
      background: var(--danger);
      color: white;
    }
  </style>
</head>

<body>

  <h1>PILLZ</h1>

  <main>

    <div class="pills-group">

      <button class="pill-btn pill-30" data-dose="30">
        30 mg
      </button>

      <button class="pill-btn pill-20" data-dose="20">
        20 mg
      </button>

      <button class="pill-btn pill-10" data-dose="10">
        10 mg
      </button>

    </div>

    <section class="today-section">

      <div class="section-title">Aujourd'hui</div>

      <div id="todayEntries" class="entries"></div>

    </section>

    <details id="history" class="history">

      <summary>Historique</summary>

      <div id="historyContent" class="history-content"></div>

    </details>

  </main>

  <!-- Modal heure manuelle -->

  <div id="timeModal" class="modal-backdrop">

    <div class="modal">

      <h2>Quelle heure ?</h2>

      <input
        id="timeInput"
        class="time-input"
        type="time"
      >

      <div class="modal-actions">

        <button
          id="cancelTime"
          class="modal-btn modal-cancel"
          type="button"
        >
          Annuler
        </button>

        <button
          id="confirmTime"
          class="modal-btn modal-confirm"
          type="button"
        >
          Valider
        </button>

      </div>

    </div>

  </div>

  <!-- Modal suppression -->

  <div id="deleteModal" class="modal-backdrop">

    <div class="modal">

      <p class="confirm-text">
        Supprimer cette prise ?
      </p>

      <div class="modal-actions">

        <button
          id="cancelDelete"
          class="modal-btn modal-cancel"
          type="button"
        >
          Annuler
        </button>

        <button
          id="confirmDelete"
          class="modal-btn confirm-delete"
          type="button"
        >
          Supprimer
        </button>

      </div>

    </div>

  </div>

  <script>
    const STORAGE_KEY = "pillz-entries";
    const RETENTION_MS = 7 * 24 * 60 * 60 * 1000;

    let pendingDose = null;
    let pendingDelete = null;

    /*
     * --------------------------------------------------
     * Dates
     * --------------------------------------------------
     */

    function getDateKey(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function todayKey() {
      return getDateKey(new Date());
    }

    function dateFromKey(key) {
      const [year, month, day] = key.split("-").map(Number);

      return new Date(
        year,
        month - 1,
        day
      );
    }

    function formatDate(key) {
      const date = dateFromKey(key);
      const today = dateFromKey(todayKey());

      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);

      if (key === todayKey()) {
        return "Aujourd'hui";
      }

      if (key === getDateKey(yesterday)) {
        return "Hier";
      }

      return new Intl.DateTimeFormat("fr-FR", {
        weekday: "long",
        day: "numeric",
        month: "long"
      }).format(date);
    }

    /*
     * --------------------------------------------------
     * Stockage
     * --------------------------------------------------
     */

    function getAllData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);

        if (!raw) {
          return {};
        }

        const data = JSON.parse(raw);

        return data && typeof data === "object"
          ? data
          : {};

      } catch {
        return {};
      }
    }

    function saveAllData(data) {
      if (Object.keys(data).length === 0) {
        localStorage.removeItem(STORAGE_KEY);
        return;
      }

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
      );
    }

    /*
     * Anciennes données :
     *
     * Les premières versions de PILLZ pouvaient stocker
     * uniquement "time" et "dose".
     *
     * Cette fonction leur donne un timestamp afin de
     * permettre la migration automatique.
     */

    function getEntryTimestamp(entry, key) {
      if (
        typeof entry.timestamp === "number" &&
        Number.isFinite(entry.timestamp)
      ) {
        return entry.timestamp;
      }

      if (!entry.time) {
        return null;
      }

      const [hours, minutes] = entry.time
        .split(":")
        .map(Number);

      if (
        !Number.isFinite(hours) ||
        !Number.isFinite(minutes)
      ) {
        return null;
      }

      const date = dateFromKey(key);

      date.setHours(
        hours,
        minutes,
        0,
        0
      );

      return date.getTime();
    }

    /*
     * --------------------------------------------------
     * Nettoyage automatique
     * --------------------------------------------------
     */

    function cleanupOldData() {
      const data = getAllData();
      const cutoff = Date.now() - RETENTION_MS;

      let changed = false;

      for (const key of Object.keys(data)) {

        const entries = Array.isArray(data[key])
          ? data[key]
          : [];

        const cleanedEntries = [];

        for (const entry of entries) {

          const timestamp = getEntryTimestamp(
            entry,
            key
          );

          if (
            timestamp !== null &&
            timestamp > cutoff
          ) {

            const normalizedEntry = {
              dose: Number(entry.dose),
              time: entry.time,
              timestamp
            };

            cleanedEntries.push(
              normalizedEntry
            );

            if (
              entry.timestamp !== timestamp
            ) {
              changed = true;
            }

          } else {
            changed = true;
          }
        }

        if (cleanedEntries.length === 0) {

          if (Object.prototype.hasOwnProperty.call(data, key)) {
            delete data[key];
            changed = true;
          }

        } else {

          data[key] = cleanedEntries;
        }
      }

      if (changed) {
        saveAllData(data);
      }
    }

    /*
     * --------------------------------------------------
     * Entrées
     * --------------------------------------------------
     */

    function getEntries(key = todayKey()) {
      const data = getAllData();

      if (!Array.isArray(data[key])) {
        return [];
      }

      return [...data[key]]
        .filter(entry => {
          return (
            typeof entry.dose !== "undefined" &&
            entry.time
          );
        })
        .sort((a, b) => {
          return (
            getEntryTimestamp(b, key) -
            getEntryTimestamp(a, key)
          );
        });
    }

    function saveEntries(key, entries) {
      const data = getAllData();

      if (entries.length === 0) {
        delete data[key];
      } else {
        data[key] = entries;
      }

      saveAllData(data);
    }

    function addEntry(
      dose,
      time = null,
      timestamp = null
    ) {
      cleanupOldData();

      const now = new Date();

      if (timestamp === null) {
        timestamp = now.getTime();
      }

      if (time === null) {
        time = now.toLocaleTimeString(
          "fr-FR",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );
      }

      const key = getDateKey(
        new Date(timestamp)
      );

      const entries = getEntries(key);

      entries.push({
        dose: Number(dose),
        time,
        timestamp
      });

      entries.sort(
        (a, b) => b.timestamp - a.timestamp
      );

      saveEntries(key, entries);

      renderToday();
      renderHistory();
    }

    /*
     * --------------------------------------------------
     * Affichage
     * --------------------------------------------------
     */

    function createEntryElement(
      entry,
      key
    ) {
      const row = document.createElement("div");
      row.className = "entry";

      const info = document.createElement("div");
      info.className = "entry-info";

      const time = document.createElement("span");
      time.className = "entry-time";
      time.textContent = entry.time;

      const dose = document.createElement("span");
      dose.className = "entry-dose";
      dose.textContent = `${entry.dose} mg`;

      const deleteButton =
        document.createElement("button");

      deleteButton.className = "delete-btn";
      deleteButton.type = "button";
      deleteButton.textContent = "×";
      deleteButton.setAttribute(
        "aria-label",
        "Supprimer cette prise"
      );

      deleteButton.addEventListener(
        "click",
        () => {
          openDeleteModal(
            key,
            entry.timestamp
          );
        }
      );

      info.appendChild(time);
      info.appendChild(dose);

      row.appendChild(info);
      row.appendChild(deleteButton);

      return row;
    }

    function renderEntries(
      container,
      key
    ) {
      container.innerHTML = "";

      const entries = getEntries(key);

      if (entries.length === 0) {

        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Aucune prise";

        container.appendChild(empty);

        return;
      }

      entries.forEach(entry => {
        container.appendChild(
          createEntryElement(
            entry,
            key
          )
        );
      });
    }

    function renderToday() {
      cleanupOldData();

      const container =
        document.getElementById(
          "todayEntries"
        );

      renderEntries(
        container,
        todayKey()
      );
    }

    /*
     * --------------------------------------------------
     * Historique
     * --------------------------------------------------
     */

    function renderHistory() {
      cleanupOldData();

      const container =
        document.getElementById(
          "historyContent"
        );

      container.innerHTML = "";

      const data = getAllData();

      const keys = Object.keys(data)
        .filter(key => {
          return (
            Array.isArray(data[key]) &&
            data[key].length > 0
          );
        })
        .sort()
        .reverse();

      /*
       * L'historique ne montre pas "Aujourd'hui",
       * puisqu'il est déjà visible au-dessus.
       */

      const previousDays = keys.filter(
        key => key !== todayKey()
      );

      if (previousDays.length === 0) {

        const empty =
          document.createElement("div");

        empty.className = "history-empty";
        empty.textContent =
          "Aucun historique disponible.";

        container.appendChild(empty);

        return;
      }

      previousDays.forEach(key => {

        const day =
          document.createElement("section");

        day.className = "history-day";

        const title =
          document.createElement("div");

        title.className = "history-date";
        title.textContent =
          formatDate(key);

        const entries =
          document.createElement("div");

        entries.className = "entries";

        renderEntries(
          entries,
          key
        );

        day.appendChild(title);
        day.appendChild(entries);

        container.appendChild(day);
      });
    }

    /*
     * --------------------------------------------------
     * Modal heure manuelle
     * --------------------------------------------------
     */

    const timeModal =
      document.getElementById(
        "timeModal"
      );

    const timeInput =
      document.getElementById(
        "timeInput"
      );

    function openTimeModal(dose) {
      pendingDose = dose;

      const now = new Date();

      timeInput.value =
        now.toLocaleTimeString(
          "fr-FR",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );

      timeModal.classList.add(
        "visible"
      );

      setTimeout(() => {
        timeInput.focus();
      }, 50);
    }

    function closeTimeModal() {
      pendingDose = null;
      timeModal.classList.remove(
        "visible"
      );
    }

    document
      .getElementById("cancelTime")
      .addEventListener(
        "click",
        closeTimeModal
      );

    document
      .getElementById("confirmTime")
      .addEventListener(
        "click",
        () => {

          if (pendingDose === null) {
            return;
          }

          const value =
            timeInput.value;

          if (!value) {
            return;
          }

          const [hours, minutes] =
            value.split(":").map(Number);

          const date = new Date();

          date.setHours(
            hours,
            minutes,
            0,
            0
          );

          addEntry(
            pendingDose,
            value,
            date.getTime()
          );

          closeTimeModal();
        }
      );

    timeModal.addEventListener(
      "click",
      event => {
        if (
          event.target === timeModal
        ) {
          closeTimeModal();
        }
      }
    );

    /*
     * --------------------------------------------------
     * Suppression
     * --------------------------------------------------
     */

    const deleteModal =
      document.getElementById(
        "deleteModal"
      );

    function openDeleteModal(
      key,
      timestamp
    ) {
      pendingDelete = {
        key,
        timestamp
      };

      deleteModal.classList.add(
        "visible"
      );
    }

    function closeDeleteModal() {
      pendingDelete = null;

      deleteModal.classList.remove(
        "visible"
      );
    }

    document
      .getElementById("cancelDelete")
      .addEventListener(
        "click",
        closeDeleteModal
      );

    document
      .getElementById("confirmDelete")
      .addEventListener(
        "click",
        () => {

          if (!pendingDelete) {
            return;
          }

          const {
            key,
            timestamp
          } = pendingDelete;

          const entries =
            getEntries(key);

          const remaining =
            entries.filter(
              entry =>
                entry.timestamp !==
                timestamp
            );

          saveEntries(
            key,
            remaining
          );

          closeDeleteModal();

          renderToday();
          renderHistory();
        }
      );

    deleteModal.addEventListener(
      "click",
      event => {
        if (
          event.target === deleteModal
        ) {
          closeDeleteModal();
        }
      }
    );

    /*
     * --------------------------------------------------
     * Boutons de dosage
     *
     * Tap court  = maintenant
     * Appui long = entrée manuelle
     * --------------------------------------------------
     */

    const LONG_PRESS_DURATION = 600;
    const MOVE_THRESHOLD = 12;

    document
      .querySelectorAll(".pill-btn")
      .forEach(button => {

        let pressTimer = null;
        let longPressTriggered = false;
        let startX = 0;
        let startY = 0;

        const dose =
          Number(
            button.dataset.dose
          );

        function clearPressTimer() {
          if (pressTimer !== null) {
            clearTimeout(
              pressTimer
            );

            pressTimer = null;
          }
        }

        button.addEventListener(
          "pointerdown",
          event => {

            if (
              event.button !== 0 &&
              event.pointerType === "mouse"
            ) {
              return;
            }

            startX = event.clientX;
            startY = event.clientY;

            longPressTriggered = false;

            clearPressTimer();

            pressTimer =
              setTimeout(() => {

                longPressTriggered = true;

                openTimeModal(dose);

              }, LONG_PRESS_DURATION);
          }
        );

        button.addEventListener(
          "pointermove",
          event => {

            const distance =
              Math.hypot(
                event.clientX - startX,
                event.clientY - startY
              );

            if (
              distance > MOVE_THRESHOLD
            ) {
              clearPressTimer();
            }
          }
        );

        button.addEventListener(
          "pointerup",
          event => {

            clearPressTimer();

            if (
              event.button !== 0 &&
              event.pointerType === "mouse"
            ) {
              return;
            }

            if (
              longPressTriggered
            ) {
              return;
            }

            addEntry(dose);
          }
        );

        button.addEventListener(
          "pointercancel",
          clearPressTimer
        );

        button.addEventListener(
          "contextmenu",
          event => {

            /*
             * Sur ordinateur, clic droit permet
             * également d'accéder à l'heure manuelle.
             */

            event.preventDefault();

            openTimeModal(dose);
          }
        );
      });

    /*
     * --------------------------------------------------
     * Nettoyage périodique
     *
     * Si l'application reste ouverte plusieurs jours,
     * les anciennes données disparaissent sans attendre
     * une nouvelle action de l'utilisateur.
     * --------------------------------------------------
     */

    setInterval(
      () => {
        cleanupOldData();
        renderToday();
        renderHistory();
      },
      60 * 1000
    );

    /*
     * --------------------------------------------------
     * Initialisation
     * --------------------------------------------------
     */

    cleanupOldData();
    renderToday();
    renderHistory();

  </script>

</body>
</html>
```
