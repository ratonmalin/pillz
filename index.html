<!DOCTYPE html>
<html lang="fr">
<head> 
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="theme-color" content="#f7f0e6">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PILLZ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2210%22 y=%2235%22 width=%2280%22 height=%2230%22 rx=%2215%22 fill=%22%23c9a8e0%22/><rect x=%2210%22 y=%2235%22 width=%2240%22 height=%2230%22 rx=%2215%22 fill=%22%23fff%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #c9a8e0;
    --bg: #f7f0e6;
    --text: #4a3b45;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4.5rem 1.5rem 3rem;
    text-align: center;
    overflow-x: hidden;
  }

  h1 {
    font-family: 'Anton', sans-serif;
    font-size: 2.8rem;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin-bottom: 3rem;
  }

  .pills-group {
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    align-items: center;
  }

  .pill-btn {
    position: relative;
    width: 190px;
    height: 68px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 1.3rem;
    transition: transform 0.15s ease;
  }

  .pill-btn:active {
    transform: scale(0.95);
  }

  .pill-btn.clicked {
    animation: bounce 0.4s ease;
  }

  .pill-btn .dose {
    position: relative;
    z-index: 1;
    font-weight: 600;
    font-size: 0.95rem;
    color: #ffffff;
  }

  @keyframes bounce {
    0% { transform: scale(1); }
    30% { transform: scale(1.15); }
    60% { transform: scale(0.92); }
    100% { transform: scale(1); }
  }

  .hint {
    margin-top: 1.6rem;
    font-size: 0.9rem;
    opacity: 0.6;
  }

  .history {
    margin-top: 3rem;
    width: 100%;
    max-width: 360px;
  }

  .history h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.55;
    margin-bottom: 1rem;
    font-weight: 500;
  }

  .entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0, 0, 0, 0.06);
    border-radius: 12px;
    padding: 0.9rem 1.1rem;
    margin-bottom: 0.6rem;
    font-size: 1rem;
    font-weight: 500;
  }

  .entry .entry-info {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .entry .entry-dose {
    font-size: 0.75rem;
    opacity: 0.6;
    font-weight: 500;
  }

  .entry button {
    background: none;
    border: none;
    color: var(--text);
    opacity: 0.5;
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
    padding: 0.2rem 0.4rem;
  }

  .entry button:active {
    opacity: 1;
  }

  .empty {
    opacity: 0.4;
    font-size: 0.95rem;
    margin-top: 1rem;
  }
</style>
</head>
<body>

<h1>PILLZ</h1>

<div class="pills-group">
  <button class="pill-btn" data-dose="30" style="background: linear-gradient(90deg, #ffffff 50%, #8f6bb3 50%)" aria-label="Enregistrer 30mg">
    <span class="dose">30mg</span>
  </button>
  <button class="pill-btn" data-dose="20" style="background: linear-gradient(90deg, #ffffff 50%, #b28fd1 50%)" aria-label="Enregistrer 20mg">
    <span class="dose">20mg</span>
  </button>
  <button class="pill-btn" data-dose="10" style="background: linear-gradient(90deg, #ffffff 50%, #d5b8ea 50%)" aria-label="Enregistrer 10mg">
    <span class="dose">10mg</span>
  </button>
</div>

<p class="hint">Appuie sur un dosage pour enregistrer une prise</p>

<div class="history">
  <h2>Aujourd'hui</h2>
  <div id="entriesList"></div>
</div>

<script>
  const entriesList = document.getElementById('entriesList');
  const pillButtons = document.querySelectorAll('.pill-btn');

  function todayKey() {
    return new Date().toISOString().slice(0, 10);
  }

  function getEntries() {
    const data = JSON.parse(localStorage.getItem('pillz-entries') || '{}');
    return data[todayKey()] || [];
  }

  function saveEntries(entries) {
    const data = JSON.parse(localStorage.getItem('pillz-entries') || '{}');
    data[todayKey()] = entries;
    localStorage.setItem('pillz-entries', JSON.stringify(data));
  }

  function addEntry(dose) {
    const now = new Date();
    const time = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const entries = getEntries();
    entries.unshift({ time, dose });
    saveEntries(entries);
    renderHistory();
  }

  function deleteEntry(index) {
    const entries = getEntries();
    entries.splice(index, 1);
    saveEntries(entries);
    renderHistory();
  }

  function renderHistory() {
    const entries = getEntries();
    entriesList.innerHTML = '';
    if (entries.length === 0) {
      entriesList.innerHTML = '<p class="empty">Aucune prise enregistrée</p>';
      return;
    }
    entries.forEach((entry, i) => {
      const row = document.createElement('div');
      row.className = 'entry';
      row.innerHTML = `
        <span class="entry-info">
          <span>${entry.time}</span>
          <span class="entry-dose">${entry.dose}mg</span>
        </span>
        <button aria-label="Supprimer">✕</button>`;
      row.querySelector('button').addEventListener('click', () => deleteEntry(i));
      entriesList.appendChild(row);
    });
  }

  pillButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.remove('clicked');
      void btn.offsetWidth;
      btn.classList.add('clicked');
      addEntry(btn.dataset.dose);
    });
  });

  renderHistory();
</script>

</body>
</html>
