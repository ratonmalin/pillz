<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PILLZ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2210%22 y=%2235%22 width=%2280%22 height=%2230%22 rx=%2215%22 fill=%22%23ff4d94%22/><rect x=%2210%22 y=%2235%22 width=%2240%22 height=%2230%22 rx=%2215%22 fill=%22%23fff%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #ff4d94;
    --bg: #0f0f14;
    --text: #f5f5f7;
    --pill-shadow: rgba(255, 77, 148, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    padding: 2rem;
    text-align: center;
    transition: background 0.4s ease, color 0.4s ease;
    overflow-x: hidden;
  }

  h1 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(2.5rem, 10vw, 4.5rem);
    letter-spacing: 0.03em;
    color: var(--accent);
    text-transform: uppercase;
    transition: color 0.4s ease;
  }

  .pill-btn {
    width: 140px;
    height: 60px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, var(--accent), #ffffff 200%);
    background-size: 250% 250%;
    background-position: 0% 50%;
    cursor: pointer;
    box-shadow: 0 8px 24px var(--pill-shadow);
    position: relative;
    transition: transform 0.15s ease, box-shadow 0.3s ease, background 0.4s ease;
  }

  .pill-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 50%; height: 100%;
    background: rgba(255,255,255,0.9);
    border-radius: 999px 0 0 999px;
  }

  .pill-btn:active {
    transform: scale(0.9) rotate(-8deg);
  }

  .pill-btn.clicked {
    animation: pop 0.5s ease;
  }

  @keyframes pop {
    0%   { transform: scale(1) rotate(0deg); }
    30%  { transform: scale(1.3) rotate(15deg); }
    50%  { transform: scale(0.85) rotate(-10deg); }
    70%  { transform: scale(1.1) rotate(5deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .subtitle {
    font-size: 0.95rem;
    opacity: 0.6;
    letter-spacing: 0.05em;
  }

  /* Sélecteur en haut à gauche */
  .theme-picker {
    position: fixed;
    top: 1.2rem;
    left: 1.2rem;
    display: flex;
    gap: 0.5rem;
    z-index: 10;
  }

  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
    cursor: pointer;
    padding: 0;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .swatch:active {
    transform: scale(0.85);
  }

  .swatch.active {
    border-color: var(--text);
    transform: scale(1.15);
  }
</style>
</head>
<body>

  <div class="theme-picker" id="themePicker"></div>

  <h1>PILLZ</h1>
  <button class="pill-btn" id="pillBtn" aria-label="Cliquer la gélule"></button>
  <p class="subtitle">appuie sur la gélule</p>

<script>
  const themes = [
    // sombres
    { bg: '#0f0f14', text: '#f5f5f7', accent: '#ff4d94' },
    { bg: '#0d1117', text: '#e6edf3', accent: '#58a6ff' },
    { bg: '#14100f', text: '#f5efe6', accent: '#ff8c42' },
    // clairs pastel
    { bg: '#fef6f9', text: '#3a2e35', accent: '#ff8fb3' },
    { bg: '#f4f9f6', text: '#2e3a35', accent: '#7fd8a4' },
    { bg: '#f7f5fb', text: '#332e3a', accent: '#b18fe0' }
  ];

  const root = document.documentElement;
  const picker = document.getElementById('themePicker');
  const pillBtn = document.getElementById('pillBtn');

  function applyTheme(theme, index) {
    root.style.setProperty('--bg', theme.bg);
    root.style.setProperty('--text', theme.text);
    root.style.setProperty('--accent', theme.accent);
    root.style.setProperty('--pill-shadow', theme.accent + '66');
    localStorage.setItem('pillz-theme', index);
    document.querySelectorAll('.swatch').forEach((s, i) => {
      s.classList.toggle('active', i === index);
    });
  }

  themes.forEach((theme, i) => {
    const btn = document.createElement('button');
    btn.className = 'swatch';
    btn.style.background = theme.accent;
    btn.setAttribute('aria-label', 'Thème ' + (i + 1));
    btn.addEventListener('click', () => applyTheme(theme, i));
    picker.appendChild(btn);
  });

  const saved = localStorage.getItem('pillz-theme');
  const initialIndex = saved !== null ? parseInt(saved) : 0;
  applyTheme(themes[initialIndex], initialIndex);

  pillBtn.addEventListener('click', () => {
    pillBtn.classList.remove('clicked');
    void pillBtn.offsetWidth;
    pillBtn.classList.add('clicked');
  });
</script>

</body>
</html>
