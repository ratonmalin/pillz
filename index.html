<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PILLZ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2210%22 y=%2235%22 width=%2280%22 height=%2230%22 rx=%2215%22 fill=%22%23e0a3c8%22/><rect x=%2210%22 y=%2235%22 width=%2240%22 height=%2230%22 rx=%2215%22 fill=%22%23fff%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #e0a3c8;
    --bg: #2b2438;
    --text: #f3e9f7;
    --pill-shadow: rgba(224, 163, 200, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4.5rem 1.5rem 3rem;
    text-align: center;
    transition: background 0.4s ease, color 0.4s ease;
    overflow-x: hidden;
  }

  .theme-picker {
    position: fixed;
    top: 1rem;
    left: 1rem;
    display: flex;
    gap: 0.5rem;
    z-index: 10;
  }

  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .swatch.active {
    border-color: var(--text);
    transform: scale(1.15);
  }

  h1 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(2.5rem, 10vw, 4.5rem);
    letter-spacing: 0.03em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 2.5rem;
    transition: color 0.4s ease;
  }

  .pill-btn {
    width: 140px;
    height: 60px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 8px 24px var(--pill-shadow);
    transition: transform 0.15s ease, box-shadow 0.3s ease, background 0.4s ease;
  }

  .pill-btn:active { transform: scale(0.9) rotate(-8deg); }
  .pill-btn.clicked { animation: pop 0.5s ease; }

  @keyframes pop {
    0%   { transform: scale(1) rotate(0deg); }
    30%  { transform: scale(1.3) rotate(15deg); }
    50%  { transform: scale(0.85) rotate(-10deg); }
    70%  { transform: scale(1.1) rotate(5deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .subtitle {
    font-size: 0.95rem;
    opacity: 0.6;
    letter-spacing: 0.05em;
    margin-top: 1.2rem;
  }

  .history-block {
    margin-top: 3rem;
    width: 100%;
    max-width: 340px;
  }

  .history-title {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.5;
    margin-bottom: 0.8rem;
  }

  .history-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.06);
    padding: 0.7rem 1rem;
    border-radius: 12px;
    font-size: 0.95rem;
  }

  .history-item .empty {
    opacity: 0.4;
    font-style: italic;
  }

  .delete-btn {
    background: none;
    border: none;
    color: inherit;
    opacity: 0.5;
    font-size: 1rem;
    cursor: pointer;
    padding: 0.2rem 0.5rem;
    transition: opacity 0.2s ease;
  }

  .delete-btn:active { opacity: 1; }

  li.empty {
    list-style: none;
    opacity: 0.4;
    font-style: italic;
    padding: 0.7rem 1rem;
  }
</style>
</head>
<body>

  <div class="theme-picker" id="themePicker"></div>

  <h1>PILLZ</h1>

  <button class="pill-btn" id="pillBtn" aria-label="Enregistrer une prise"></button>
  <p class="subtitle">Appuie pour enregistrer une prise</p>

  <div class="history-block">
    <p class="history-title">Aujourd'hui</p>
    <ul class="history-list" id="historyList"></ul>
  </div>

<script>
  const root = document.documentElement;
  const picker = document.getElementById('themePicker');
  const pillBtn = document.getElementById('pillBtn');
  const historyList = document.getElementById('historyList');

  const themes = [
    { bg: '#2b2438', text: '#f3e9f7', accent: '#e0a3c8' },
    { bg: '#233029', text: '#e6f2ea', accent: '#9bc9a8' },
    { bg: '#2e2624', text: '#f5e8dc', accent: '#e0b088' },
    { bg: '#fdf1f5', text: '#4a3b45', accent: '#f2a6c4' },
    { bg: '#f0f7f2', text: '#37453d', accent: '#a8d4b5' },
    { bg: '#fdf6ec', text: '#4a4033', accent: '#f0c987' }
  ];

  function todayKey() {
    const d = new Date();
    return 'pillz-' + d.toISOString().slice(0, 10);
  }

  function loadEntries() {
    const raw = localStorage.getItem(todayKey());
    return raw ? JSON.parse(raw) : [];
  }

  function saveEntries(entries) {
    localStorage.setItem(todayKey(), JSON.stringify(entries));
  }

  function renderHistory() {
    const entries = loadEntries();
    historyList.innerHTML = '';

    if (entries.length === 0) {
      historyList.innerHTML = '<li class="empty">Aucune prise enregistrée</li>';
      return;
    }

    entries.slice().reverse().forEach((entry) => {
      const li = document.createElement('li');
      li.className = 'history-item';
      const time = document.createElement('span');
      time.textContent = entry.time;
      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = '✕';
      delBtn.setAttribute('aria-label', 'Supprimer cette prise');
      delBtn.addEventListener('click', () => {
        const current = loadEntries();
        const updated = current.filter((e) => e.id !== entry.id);
        saveEntries(updated);
        renderHistory();
      });
      li.appendChild(time);
      li.appendChild(delBtn);
      historyList.appendChild(li);
    });
  }

  function addEntry() {
    const entries = loadEntries();
    const now = new Date();
    entries.push({
      id: Date.now(),
      time: now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
    });
    saveEntries(entries);
    renderHistory();
  }

  function applyTheme(theme, index) {
    root.style.setProperty('--bg', theme.bg);
    root.style.setProperty('--text', theme.text);
    root.style.setProperty('--accent', theme.accent);
    root.style.setProperty('--pill-shadow', theme.accent + '66');
    localStorage.setItem('pillz-theme', index);
    document.querySelectorAll('.swatch').forEach((s, i) => {
      s.classList.toggle('active', i === index);
    });
  }

  themes.forEach((theme, i) => {
    const btn = document.createElement('button');
    btn.className = 'swatch';
    btn.style.background = theme.accent;
    btn.setAttribute('aria-label', 'Thème ' + (i + 1));
    btn.addEventListener('click', () => applyTheme(theme, i));
    picker.appendChild(btn);
  });

  const saved = localStorage.getItem('pillz-theme');
  const initialIndex = saved !== null ? parseInt(saved) : 0;
  applyTheme(themes[initialIndex], initialIndex);

  pillBtn.addEventListener('click', () => {
    pillBtn.classList.remove('clicked');
    void pillBtn.offsetWidth;
    pillBtn.classList.add('clicked');
    addEntry();
  });

  renderHistory();
</script>

</body>
</html>
